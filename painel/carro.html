<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fotos do carro · Pedro Paulo Automóveis</title>
<meta name="description" content="Veja as fotos do carro e fale com a Pedro Paulo Automóveis no WhatsApp.">
<!-- prévia do link no WhatsApp: a página é a mesma para todo carro, então a imagem é o logo da loja -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Pedro Paulo Automóveis">
<meta property="og:title" content="Fotos do carro · Pedro Paulo Automóveis">
<meta property="og:description" content="Veja as fotos e fale com a loja no WhatsApp.">
<meta property="og:image" content="https://pp-painel-leads.vercel.app/icone-512.png">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F2022">
<link rel="icon" href="/icone-192.png">
<style>
  /* Página de fotos que a Bia manda ao cliente (23/11/2026). Cores do app da PP: grafite e o vermelho #B81111. */
  :root { --f: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
          --chao:#1F2022; --folha:#2A2C2F; --tinta:#F2F2F3; --apoio:#9B9C9E; --fio:#3D3F43; --marca:#B81111; --acao:#FF5A5F; --zap:#25D366; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { background: var(--chao); color: var(--tinta); margin: 0; }
  body { border-top: 4px solid var(--marca); font: 400 15px/1.5 var(--f); padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
  .pg { max-width: 920px; margin: 0 auto; display: grid; gap: 16px; }
  .logo { width: 132px; height: auto; display: block; }
  h1 { margin: 0; font: 650 clamp(21px, 5.4vw, 30px)/1.15 var(--f); letter-spacing: -.01em; }
  .preco { font: 700 clamp(24px, 6vw, 32px)/1 var(--f); color: var(--tinta); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .preco small { display: block; font: 500 13px/1.4 var(--f); color: var(--apoio); margin-top: 6px; }
  .fichas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding: 0; list-style: none; }
  .fichas li { background: var(--folha); border: 1px solid var(--fio); border-radius: 999px; padding: 6px 12px; font-size: 14px; }
  .fichas li b { color: var(--apoio); font-weight: 600; margin-right: 4px; }
  .galeria { position: relative; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--fio); }
  .trilho { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; aspect-ratio: 4 / 3; }
  .trilho::-webkit-scrollbar { display: none; }
  .trilho img { flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; scroll-snap-align: center; background: #000; }
  .conta { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.62); color: #fff; font: 600 13px/1 var(--f); padding: 7px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
  .seta { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font: 600 22px/1 var(--f); cursor: pointer; display: grid; place-items: center; }
  .seta.ant { left: 10px; } .seta.prox { right: 10px; }
  .miniaturas { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .miniaturas button { padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: #000; cursor: pointer; aspect-ratio: 4 / 3; }
  .miniaturas button[aria-current="true"] { border-color: var(--acao); }
  .miniaturas img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .loja { color: var(--apoio); font-size: 14px; margin: 0; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(31,32,34,0), var(--chao) 30%); }
  .zap { display: flex; align-items: center; justify-content: center; gap: 10px; max-width: 920px; margin: 0 auto; min-height: 52px; border-radius: 10px; background: var(--marca); color: #fff; font: 650 16px/1 var(--f); text-decoration: none; }
  .zap svg { width: 22px; height: 22px; }
  .aviso { background: var(--folha); border: 1px solid var(--fio); border-radius: 12px; padding: 22px; display: grid; gap: 8px; }
  .aviso h1 { font-size: clamp(20px, 5vw, 26px); }
  .aviso p { margin: 0; color: var(--apoio); }
  .carregando { color: var(--apoio); }
  @media (max-width: 640px) { .seta { display: none; } .miniaturas { display: none; } }
</style>
</head>
<body>
<main class="pg" id="pg">
  <img class="logo" src="/logo-pp.png" alt="Pedro Paulo Automóveis">
  <p class="carregando" id="carregando">Carregando as fotos…</p>
</main>
<div class="barra" id="barra" hidden><a class="zap" id="zap" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91A9.9 9.9 0 0 0 12.04 2zm5.8 14.03c-.24.68-1.42 1.3-1.95 1.34-.5.05-.97.24-3.27-.68-2.77-1.09-4.52-3.93-4.66-4.11-.13-.18-1.11-1.48-1.11-2.82 0-1.34.7-2 .95-2.27.24-.27.53-.34.71-.34l.51.01c.16.01.38-.06.6.46.24.56.8 1.93.87 2.07.07.14.12.3.02.48-.09.18-.14.3-.27.46-.14.16-.29.36-.41.48-.14.14-.28.29-.12.56.16.27.71 1.17 1.52 1.9 1.05.93 1.93 1.22 2.2 1.36.27.14.43.11.59-.07.16-.18.68-.79.86-1.07.18-.27.36-.23.6-.14.25.09 1.58.75 1.85.88.27.14.45.2.52.32.07.11.07.66-.17 1.34z"/></svg>
  <span>Falar com a loja no WhatsApp</span></a></div>
<script>
var FUNCAO = "https://qdzuwnqejtjbtcysteip.supabase.co/functions/v1/pre-atendimento?painel=carro&c=";
var pg = document.getElementById("pg");
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function brl(n) { return Number(n).toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 }); }
/* "Volkswagen Gol 1.6 (G5) (Flex) 2011/2012 flex" vira "Volkswagen Gol 1.6 (G5) 2011/2012" */
function nomeDoCarro(t) { return String(t || "").replace(/\s*\((flex|gasolina|diesel|álcool)\)/ig, "").replace(/\s+(flex|gasolina|diesel|álcool|elétrico|híbrido)$/i, "").replace(/\s{2,}/g, " ").trim(); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function botaoZap(loja, texto) {
  if (!loja || !loja.whatsapp) return;
  document.getElementById("zap").href = loja.whatsapp + "?text=" + encodeURIComponent(texto);
  document.getElementById("barra").hidden = false;
}
function aviso(titulo, texto, loja) {
  pg.innerHTML = '<img class="logo" src="/logo-pp.png" alt="Pedro Paulo Automóveis"><section class="aviso"><h1>' + esc(titulo) + "</h1><p>" + esc(texto) + "</p></section>" +
    (loja && loja.endereco ? '<p class="loja">' + esc(loja.nome) + " · " + esc(loja.endereco) + "</p>" : "");
}
var codigo = new URLSearchParams(location.search).get("c") || "";
if (!/^\d{1,12}$/.test(codigo)) aviso("Link incompleto", "Peça o link das fotos de novo no WhatsApp da loja.");
else fetch(FUNCAO + encodeURIComponent(codigo)).then(function (r) { return r.json(); }).then(function (c) {
  if (c.vendido) {
    aviso("Este carro já foi vendido", "Fale com a loja no WhatsApp: temos outros carros parecidos para te mostrar.", c.loja);
    botaoZap(c.loja, "Oi! Vi que o carro do link já foi vendido. Quais parecidos vocês têm?");
    return;
  }
  if (!c.titulo) throw new Error("sem carro");
  var nome = nomeDoCarro(c.titulo), fotos = c.fotos || [];
  document.title = nome + " · Pedro Paulo Automóveis";
  var fichas = [c.km != null ? "<li><b>km</b>" + Number(c.km).toLocaleString("pt-BR") + "</li>" : "", c.cor ? "<li><b>cor</b>" + esc(cap(c.cor)) + "</li>" : "",
    c.cambio ? "<li><b>câmbio</b>" + esc(cap(c.cambio)) + "</li>" : ""].join("");
  pg.innerHTML = '<img class="logo" src="/logo-pp.png" alt="Pedro Paulo Automóveis">' +
    "<header><h1>" + esc(nome) + "</h1>" +
    '<div class="preco">' + (c.preco ? brl(c.preco) : "Preço com o consultor") + (c.preco ? "<small>Preço anunciado. Condições e troca com o consultor.</small>" : "") + "</div>" +
    (fichas ? '<ul class="fichas">' + fichas + "</ul>" : "") + "</header>" +
    (fotos.length ? '<section class="galeria" aria-label="Fotos do carro"><div class="trilho" id="trilho">' +
      fotos.map(function (u, i) { return '<img src="' + esc(u) + '" alt="Foto ' + (i + 1) + " de " + fotos.length + '" loading="' + (i < 2 ? "eager" : "lazy") + '" decoding="async">'; }).join("") +
      '</div><span class="conta" id="conta">1 / ' + fotos.length + "</span>" +
      (fotos.length > 1 ? '<button class="seta ant" type="button" id="ant" aria-label="Foto anterior">‹</button><button class="seta prox" type="button" id="prox" aria-label="Próxima foto">›</button>' : "") + "</section>" +
      (fotos.length > 1 ? '<div class="miniaturas">' + fotos.map(function (u, i) { return '<button type="button" data-i="' + i + '" aria-label="Ver foto ' + (i + 1) + '"' + (i === 0 ? ' aria-current="true"' : "") + '><img src="' + esc(u) + '" alt="" loading="lazy" decoding="async"></button>'; }).join("") + "</div>" : "")
      : '<section class="aviso"><p>As fotos deste carro o consultor te manda pelo WhatsApp.</p></section>') +
    (c.loja && c.loja.endereco ? '<p class="loja">' + esc(c.loja.nome) + " · " + esc(c.loja.endereco) + "</p>" : "");
  botaoZap(c.loja, "Oi! Vi as fotos do " + nome + " e quero saber mais.");
  var trilho = document.getElementById("trilho");
  if (!trilho) return;
  var atual = 0, conta = document.getElementById("conta");
  var ir = function (i) { i = Math.max(0, Math.min(fotos.length - 1, i)); trilho.scrollTo({ left: i * trilho.clientWidth, behavior: "smooth" }); };
  trilho.addEventListener("scroll", function () {
    var i = Math.round(trilho.scrollLeft / Math.max(1, trilho.clientWidth));
    if (i === atual) return;
    atual = i; conta.textContent = (i + 1) + " / " + fotos.length;
    document.querySelectorAll(".miniaturas button").forEach(function (b) { b.setAttribute("aria-current", String(Number(b.dataset.i) === i)); });
  }, { passive: true });
  if (document.getElementById("ant")) {
    document.getElementById("ant").addEventListener("click", function () { ir(atual - 1); });
    document.getElementById("prox").addEventListener("click", function () { ir(atual + 1); });
  }
  document.querySelectorAll(".miniaturas button").forEach(function (b) { b.addEventListener("click", function () { ir(Number(b.dataset.i)); }); });
  document.addEventListener("keydown", function (e) { if (e.key === "ArrowLeft") ir(atual - 1); if (e.key === "ArrowRight") ir(atual + 1); });
}).catch(function () { aviso("Não deu para abrir as fotos agora", "Tente de novo em instantes ou fale com a loja no WhatsApp."); });
</script>
</body>
</html>
